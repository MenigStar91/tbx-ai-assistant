services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./data/uploads:/app/data/uploads"]
    depends_on: [db]
  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tbx_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
